services:
  frontend:
    build: ./frontend
    networks:
      - ai_network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    command: npm run dev
    depends_on:
      - backend

  backend:
    build: ./backend
    networks:
      - ai_network
    volumes:
      - ./backend:/app
      - file_uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - INFERENCE_URL=http://host.docker.internal:8081
      - NUMBA_CACHE_DIR=/tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "8000:8000"

  db:
    image: timescale/timescaledb-ha:pg16
    networks:
      - ai_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    networks:
      - ai_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery_worker:
    build: ./backend
    networks:
      - ai_network
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    restart: on-failure
    volumes:
      - ./backend:/app
      - file_uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - NUMBA_CACHE_DIR=/tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  file_uploads:

networks:
  ai_network:
    driver: bridge
