name: Project CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  # --- Backend CI ---
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Load Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: ghcr.io/${{ github.repository }}/backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Backend Tests
        run: |
          docker run --rm --network host ghcr.io/${{ github.repository }}/backend:test pytest

      - name: Push Backend Image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        run: |
          TAG_NAME=${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
          docker tag ghcr.io/${{ github.repository }}/backend:test ghcr.io/${{ github.repository }}/backend:$TAG_NAME
          docker push ghcr.io/${{ github.repository }}/backend:$TAG_NAME

  # --- Frontend CI ---
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Load Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: ghcr.io/${{ github.repository }}/frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Frontend Lint and Test
        run: |
          docker run --rm ghcr.io/${{ github.repository }}/frontend:test npm run lint
          docker run --rm ghcr.io/${{ github.repository }}/frontend:test npm test

      - name: Push Frontend Image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        run: |
          TAG_NAME=${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
          docker tag ghcr.io/${{ github.repository }}/frontend:test ghcr.io/${{ github.repository }}/frontend:$TAG_NAME
          docker push ghcr.io/${{ github.repository }}/frontend:$TAG_NAME
